<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Key Beauty · Catálogo</title>
<meta name="description" content="Catálogo de fragancias y cuidado personal Key Beauty. Pide por WhatsApp.">
<meta name="theme-color" content="#c94f76">
<link rel="icon" href="images/kitchen-lemon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rosa-marca:#f6c9d2;
    --rosa-suave:#fdf1f4;
    --rosa-medio:#f6dbe2;
    --rosa-oscuro:#c94f76;
    --rosa-oscuro-2:#e17a9b;
    --ciruela:#4a2733;
    --ciruela-suave:#7a4a5a;
    --blanco:#ffffff;
    --sombra: 0 10px 24px -12px rgba(74,39,51,0.28);
    --radio: 22px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--rosa-suave);
    color:var(--ciruela);
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
  }
  img{max-width:100%;display:block;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}

  /* Fondo decorativo */
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    opacity:.5;
    z-index:0;
    pointer-events:none;
  }
  .blob--1{width:220px;height:220px;background:var(--rosa-medio);top:-60px;right:-70px;}
  .blob--2{width:160px;height:160px;background:var(--rosa-marca);bottom:10%;left:-80px;opacity:.35;}

  /* ===== HEADER ===== */
  header.hero{
    position:relative;
    background:linear-gradient(160deg,var(--rosa-oscuro) 0%,var(--rosa-oscuro-2) 100%);
    padding:28px 20px 56px;
    text-align:center;
    overflow:hidden;
    z-index:1;
  }
  header.hero::before{
    content:"";
    position:absolute;
    width:280px;height:280px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    top:-140px; left:-60px;
  }
  header.hero .logo-word{
    width:min(240px,58vw);
    margin:6px auto 4px;
    filter:drop-shadow(0 6px 10px rgba(74,39,51,0.25));
  }
  header.hero p.tagline{
    margin:2px 0 0;
    color:#fdeef2;
    font-size:.92rem;
    letter-spacing:.02em;
    position:relative;
  }
  .btn-grupo{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:14px;
    background:rgba(255,255,255,.16);
    border:1.5px solid rgba(255,255,255,.55);
    color:#fff;
    padding:9px 18px;
    border-radius:999px;
    font-size:.8rem;
    font-weight:600;
    backdrop-filter:blur(2px);
    transition:background .15s ease;
  }
  .btn-grupo:hover{background:rgba(255,255,255,.28);}
  .btn-grupo svg{width:15px;height:15px;flex:none;}
  .wave{
    display:block;
    position:relative;
    margin-top:-2px;
  }
  .wave svg{display:block;width:100%;height:34px;}

  /* ===== BUSCADOR + FILTROS (flotante) ===== */
  .panel-buscar{
    position:relative;
    z-index:2;
    margin:-40px 16px 0;
    background:var(--blanco);
    border-radius:var(--radio);
    box-shadow:var(--sombra);
    padding:14px 14px 10px;
  }
  .caja-busqueda{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--rosa-suave);
    border-radius:999px;
    padding:11px 16px;
  }
  .caja-busqueda svg{flex:none;color:var(--rosa-oscuro);}
  .caja-busqueda input{
    border:none;
    outline:none;
    background:transparent;
    width:100%;
    font-family:'Poppins',sans-serif;
    font-size:.95rem;
    color:var(--ciruela);
  }
  .caja-busqueda input::placeholder{color:#c79aa8;}

  .categorias{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 2px 6px;
    scrollbar-width:none;
  }
  .categorias::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;
    padding:8px 16px;
    border-radius:999px;
    background:var(--rosa-suave);
    color:var(--ciruela-suave);
    font-size:.82rem;
    font-weight:600;
    border:1.5px solid transparent;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip.activo{
    background:var(--rosa-oscuro);
    color:#fff;
  }

  /* ===== GRID PRODUCTOS ===== */
  main{
    position:relative;
    z-index:1;
    padding:18px 16px 8px;
    max-width:560px;
    margin:0 auto;
  }
  .resultado-info{
    font-size:.8rem;
    color:var(--ciruela-suave);
    margin:2px 4px 12px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .tarjeta{
    background:var(--blanco);
    border-radius:20px;
    box-shadow:var(--sombra);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    animation:aparecer .35s ease both;
  }
  @keyframes aparecer{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .tarjeta .foto-wrap{
    position:relative;
    background:var(--rosa-suave);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  .tarjeta .foto-wrap img{
    max-height:100%;
    max-width:100%;
    object-fit:contain;
    mix-blend-mode:multiply;
  }
  .etiqueta-cat{
    position:absolute;
    top:8px; left:8px;
    background:rgba(255,255,255,.9);
    color:var(--rosa-oscuro);
    font-size:.62rem;
    font-weight:700;
    letter-spacing:.02em;
    padding:4px 9px;
    border-radius:999px;
  }
  .etiqueta-agotado{
    position:absolute;
    top:8px; right:8px;
    background:#7a4a5a;
    color:#fff;
    font-size:.62rem;
    font-weight:700;
    letter-spacing:.02em;
    padding:4px 9px;
    border-radius:999px;
  }
  .tarjeta.agotado{
    filter:grayscale(.85);
    opacity:.68;
  }
  .stock{
    font-size:.68rem;
    font-weight:600;
    color:var(--ciruela-suave);
  }
  .stock.bajo{color:var(--rosa-oscuro);}
  .btn-wa.agotado-btn{
    background:#c9b7bd;
    cursor:not-allowed;
    pointer-events:none;
  }
  .tarjeta .info{
    padding:10px 12px 12px;
    display:flex;
    flex-direction:column;
    flex:1;
  }
  .tarjeta h3{
    font-family:'Baloo 2',cursive;
    font-size:1.02rem;
    line-height:1.15;
    margin:0 0 4px;
    color:var(--ciruela);
  }
  .tarjeta .descripcion{
    font-size:.74rem;
    color:var(--ciruela-suave);
    line-height:1.35;
    margin:0 0 10px;
    flex:1;
  }
  .fila-precio{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    margin-bottom:12px;
  }
  .precio{
    font-family:'Baloo 2',cursive;
    font-size:1.15rem;
    color:var(--rosa-oscuro);
  }
  .precio small{font-size:.65rem;font-family:'Poppins',sans-serif;font-weight:600;color:var(--ciruela-suave);}
  .stock{display:block;}
  .btn-wa{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--rosa-oscuro);
    color:#fff;
    padding:9px 10px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:600;
    border:none;
    width:100%;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .btn-wa:active{transform:scale(.97);}
  .btn-wa:hover{background:#b83e66;}
  .btn-wa svg{width:15px;height:15px;flex:none;}

  .vacio{
    text-align:center;
    padding:50px 20px;
    color:var(--ciruela-suave);
  }
  .vacio svg{width:46px;height:46px;color:var(--rosa-marca);margin-bottom:10px;}
  .vacio p{margin:2px 0;font-size:.9rem;}

  /* ===== FOOTER ===== */
  footer{
    position:relative;
    z-index:1;
    margin-top:26px;
    background:var(--ciruela);
    color:#f6d9e0;
    padding:30px 20px 26px;
    text-align:center;
  }
  footer .logo-word{width:150px;margin:0 auto 14px;filter:brightness(0) invert(1) opacity(.92);}
  .contactos{
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
  }
  .contacto-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:.88rem;
    font-weight:600;
    color:#fbe4ea;
    padding:8px 16px;
    border:1.5px solid rgba(251,228,234,.35);
    border-radius:999px;
  }
  .contacto-link svg{width:16px;height:16px;}
  footer .nota{font-size:.72rem;color:#c99aa8;margin:0;}

  @media (min-width:480px){
    .grid{grid-template-columns:1fr 1fr 1fr;}
  }
</style>
</head>
<body>

<div class="blob blob--1"></div>
<div class="blob blob--2"></div>

<header class="hero">
  <img class="logo-word" src="logo-wordmark.png" alt="Key Beauty">
  <p class="tagline">Fragancias &amp; cuidado personal</p>
  <a class="btn-grupo" href="https://chat.whatsapp.com/FZbzKlzhANi1YtGTDVIMqW?s=cl&amp;p=a&amp;ilr=1" target="_blank" rel="noopener">
    <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16.02 3C9.4 3 4 8.4 4 15.02c0 2.34.66 4.52 1.8 6.38L4 29l7.78-1.75a12.9 12.9 0 0 0 4.24.72c6.62 0 12.02-5.4 12.02-12.02C28 8.4 22.64 3 16.02 3zm0 21.9c-1.98 0-3.83-.55-5.4-1.5l-.39-.23-4.62 1.04 1.03-4.5-.25-.4a9.9 9.9 0 0 1-1.56-5.29c0-5.46 4.45-9.9 9.9-9.9 5.45 0 9.9 4.44 9.9 9.9s-4.45 9.88-9.9 9.88h.29zm5.4-7.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.66.15-.2.3-.76.97-.93 1.17-.17.2-.34.22-.63.07-.3-.15-1.26-.46-2.4-1.48-.89-.8-1.48-1.78-1.66-2.08-.17-.3-.02-.46.13-.6.13-.13.3-.34.44-.5.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.66-1.6-.91-2.19-.24-.58-.48-.5-.66-.5h-.56c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.09 4.49.71.31 1.27.49 1.7.62.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35z"/></svg>
    Únete al grupo de novedades
  </a>
  <div class="wave">
    <svg viewBox="0 0 500 40" preserveAspectRatio="none">
      <path d="M0,20 C125,45 375,-5 500,20 L500,40 L0,40 Z" fill="#fdf1f4"></path>
    </svg>
  </div>
</header>

<div class="panel-buscar">
  <div class="caja-busqueda">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <input type="text" id="buscador" placeholder="Buscar un producto...">
  </div>
  <div class="categorias" id="categorias"></div>
</div>

<main>
  <p class="resultado-info" id="resultadoInfo"></p>
  <div class="grid" id="grid"></div>
  <div class="vacio" id="vacio" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <p><strong>No encontramos ese producto</strong></p>
    <p>Prueba con otra palabra o categoría.</p>
  </div>
</main>

<footer>
  <img class="logo-word" src="logo-wordmark.png" alt="Key Beauty">
  <div class="contactos">
    <a class="contacto-link" href="https://instagram.com/key_beautyconcept" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
      @key_beautyconcept
    </a>
    <a class="contacto-link" href="https://chat.whatsapp.com/FZbzKlzhANi1YtGTDVIMqW?s=cl&amp;p=a&amp;ilr=1" target="_blank" rel="noopener">
      <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16.02 3C9.4 3 4 8.4 4 15.02c0 2.34.66 4.52 1.8 6.38L4 29l7.78-1.75a12.9 12.9 0 0 0 4.24.72c6.62 0 12.02-5.4 12.02-12.02C28 8.4 22.64 3 16.02 3zm0 21.9c-1.98 0-3.83-.55-5.4-1.5l-.39-.23-4.62 1.04 1.03-4.5-.25-.4a9.9 9.9 0 0 1-1.56-5.29c0-5.46 4.45-9.9 9.9-9.9 5.45 0 9.9 4.44 9.9 9.9s-4.45 9.88-9.9 9.88h.29zm5.4-7.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.66.15-.2.3-.76.97-.93 1.17-.17.2-.34.22-.63.07-.3-.15-1.26-.46-2.4-1.48-.89-.8-1.48-1.78-1.66-2.08-.17-.3-.02-.46.13-.6.13-.13.3-.34.44-.5.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.66-1.6-.91-2.19-.24-.58-.48-.5-.66-.5h-.56c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.09 4.49.71.31 1.27.49 1.7.62.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35z"/></svg>
      Grupo de novedades
    </a>
  </div>
  <p class="nota">Catálogo Key Beauty · pedidos directo por WhatsApp</p>
</footer>

<script>
(function(){
  const grid = document.getElementById('grid');
  const categoriasEl = document.getElementById('categorias');
  const buscador = document.getElementById('buscador');
  const vacioEl = document.getElementById('vacio');
  const infoEl = document.getElementById('resultadoInfo');
  const WHATSAPP_NUM = "529988284153";

  let productos = [];
  let categoriaActiva = "Todos";

  function money(n){
    return "$" + n.toLocaleString('es-MX');
  }

  function linkWhatsApp(nombre, precio){
    const msg = `Hola Key Beauty 💕 Me interesa este producto:\n*${nombre}* (${money(precio)} MXN)\n¿Está disponible?`;
    return `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(msg)}`;
  }

  function renderCategorias(){
    const cats = ["Todos", ...new Set(productos.map(p => p.categoria))];
    categoriasEl.innerHTML = cats.map(c =>
      `<button class="chip${c===categoriaActiva?' activo':''}" data-cat="${c}">${c}</button>`
    ).join('');
    categoriasEl.querySelectorAll('.chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        categoriaActiva = btn.dataset.cat;
        renderCategorias();
        renderGrid();
      });
    });
  }

  function renderGrid(){
    const q = buscador.value.trim().toLowerCase();
    const filtrados = productos.filter(p=>{
      const coincideCat = categoriaActiva === "Todos" || p.categoria === categoriaActiva;
      const coincideTexto = !q || p.nombre.toLowerCase().includes(q) || p.descripcion.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q);
      return coincideCat && coincideTexto;
    });

    infoEl.textContent = filtrados.length === productos.length
      ? `${productos.length} productos`
      : `${filtrados.length} de ${productos.length} productos`;

    if(filtrados.length === 0){
      grid.style.display = 'none';
      vacioEl.style.display = 'block';
      return;
    }
    grid.style.display = 'grid';
    vacioEl.style.display = 'none';

    grid.innerHTML = filtrados.map(p => {
      const cantidad = Number(p.cantidad);
      const agotado = !isNaN(cantidad) && cantidad <= 0;
      const stockBajo = !agotado && !isNaN(cantidad) && cantidad <= 3;

      const infoStock = isNaN(p.cantidad)
        ? ''
        : agotado
          ? ''
          : `<span class="stock${stockBajo ? ' bajo' : ''}">Disponibles: ${cantidad}</span>`;

      const boton = agotado
        ? `<button class="btn-wa agotado-btn" disabled>Agotado</button>`
        : `<a class="btn-wa" href="${linkWhatsApp(p.nombre, p.precio)}" target="_blank" rel="noopener">
            <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16.02 3C9.4 3 4 8.4 4 15.02c0 2.34.66 4.52 1.8 6.38L4 29l7.78-1.75a12.9 12.9 0 0 0 4.24.72c6.62 0 12.02-5.4 12.02-12.02C28 8.4 22.64 3 16.02 3zm0 21.9c-1.98 0-3.83-.55-5.4-1.5l-.39-.23-4.62 1.04 1.03-4.5-.25-.4a9.9 9.9 0 0 1-1.56-5.29c0-5.46 4.45-9.9 9.9-9.9 5.45 0 9.9 4.44 9.9 9.9s-4.45 9.88-9.9 9.88h.29zm5.4-7.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.66.15-.2.3-.76.97-.93 1.17-.17.2-.34.22-.63.07-.3-.15-1.26-.46-2.4-1.48-.89-.8-1.48-1.78-1.66-2.08-.17-.3-.02-.46.13-.6.13-.13.3-.34.44-.5.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.66-1.6-.91-2.19-.24-.58-.48-.5-.66-.5h-.56c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.09 4.49.71.31 1.27.49 1.7.62.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35z"/></svg>
            Pedir por WhatsApp
          </a>`;

      return `
      <article class="tarjeta${agotado ? ' agotado' : ''}">
        <div class="foto-wrap">
          <span class="etiqueta-cat">${p.categoria}</span>
          ${agotado ? '<span class="etiqueta-agotado">Agotado</span>' : ''}
          <img src="${p.imagen_url}" alt="${p.nombre}" loading="lazy">
        </div>
        <div class="info">
          <h3>${p.nombre}</h3>
          <p class="descripcion">${p.descripcion}</p>
          <div class="fila-precio">
            <span class="precio">${money(p.precio)} <small>MXN</small></span>
            ${infoStock}
          </div>
          ${boton}
        </div>
      </article>
    `;
    }).join('');
  }

  buscador.addEventListener('input', renderGrid);

  fetch('productos.json')
    .then(r=>{
      if(!r.ok) throw new Error('No se pudo cargar productos.json');
      return r.json();
    })
    .then(data=>{
      productos = data;
      renderCategorias();
      renderGrid();
    })
    .catch(err=>{
      grid.style.display='none';
      vacioEl.style.display='block';
      vacioEl.innerHTML = `<p><strong>No se pudo cargar el catálogo</strong></p>
        <p>Asegúrate de abrir esta página desde un servidor/hosting (no directamente como archivo local) y que <code>productos.json</code> esté en la misma carpeta.</p>`;
      console.error(err);
    });
})();
</script>

</body>
</html>
